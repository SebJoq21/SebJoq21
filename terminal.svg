<svg width="800" height="295" viewBox="0 0 800 295" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #1a1b27; }
    .header { fill: #13141f; }
    .border {
      stroke: #7aa2f7;
      stroke-width: 1.5;
      animation: borderPulse 4s ease-in-out infinite;
    }
    .font { font-family: 'Fira Code', 'Cascadia Code', Consolas, monospace; font-size: 13.5px; }
    .title { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #9aa5ce; font-weight: 600; }
    .status-text { font-family: monospace; font-size: 11px; fill: #9ece6a; font-weight: bold; }
    .kw { fill: #bb9af7; }
    .var { fill: #c0caf5; }
    .type { fill: #7dcfff; }
    .prop { fill: #7aa2f7; }
    .str { fill: #9ece6a; }
    .punct { fill: #89ddff; }
    .line-num { fill: #414868; }

    @keyframes borderPulse {
      0%, 100% { stroke: #7aa2f7; stroke-opacity: 0.4; }
      50% { stroke: #bb9af7; stroke-opacity: 0.9; }
    }
    @keyframes dotPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateX(-6px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .pulse { animation: dotPulse 2s infinite; }
    .cursor { animation: blink 1s infinite; fill: #00f5d4; }
    .l1 { opacity: 0; animation: fadeIn 0.4s ease forwards 0.1s; }
    .l2 { opacity: 0; animation: fadeIn 0.4s ease forwards 0.25s; }
    .l3 { opacity: 0; animation: fadeIn 0.4s ease forwards 0.4s; }
    .l4 { opacity: 0; animation: fadeIn 0.4s ease forwards 0.55s; }
    .l5 { opacity: 0; animation: fadeIn 0.4s ease forwards 0.7s; }
    .l6 { opacity: 0; animation: fadeIn 0.4s ease forwards 0.85s; }
    .l7 { opacity: 0; animation: fadeIn 0.4s ease forwards 1.0s; }
    .l8 { opacity: 0; animation: fadeIn 0.4s ease forwards 1.15s; }
    .l9 { opacity: 0; animation: fadeIn 0.4s ease forwards 1.3s; }
    .l10 { opacity: 0; animation: fadeIn 0.4s ease forwards 1.45s; }
    .l11 { opacity: 0; animation: fadeIn 0.4s ease forwards 1.6s; }
  </style>

  
  <rect x="2" y="2" width="796" height="291" rx="12" class="bg border" />
  <path d="M2 14C2 7.37258 7.37258 2 14 2H786C792.627 2 798 7.37258 798 14V38H2V14Z" class="header" />

  
  <circle cx="22" cy="20" r="6" fill="#f7768e" />
  <circle cx="42" cy="20" r="6" fill="#e0af68" />
  <circle cx="62" cy="20" r="6" fill="#9ece6a" />

  
  <text x="355" y="24" class="title">sebastian.ts — SebJoq21</text>

  
  <circle cx="715" cy="20" r="4" fill="#9ece6a" class="pulse" />
