<svg width="850" height="58" viewBox="0 0 850 58" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="scanPurple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0" />
      <stop offset="50%" stop-color="#e879f9" stop-opacity="1" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>
    <clipPath id="lineClip3">
      <rect x="4" y="48" width="842" height="2.5" rx="1.25" />
    </clipPath>
  </defs>
  <style>
    .num { font-family: 'Fira Code', Consolas, monospace; font-size: 12px; font-weight: 800; fill: #e879f9; }
    .txt { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 800; fill: #e2e8f0; letter-spacing: 2.5px; }
    @keyframes scan {
      0% { transform: translateX(-220px); }
      100% { transform: translateX(900px); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }
    @keyframes eq {
      0%, 100% { transform: scaleY(1); }
      50% { transform: scaleY(0.35); }
    }
    .beam { animation: scan 3.2s linear infinite 1.6s; }
    .dot { animation: pulse 1.8s ease-in-out infinite; }
    .e1 { transform-origin: 820px 30px; animation: eq 1.1s ease-in-out infinite; }
    .e2 { transform-origin: 828px 30px; animation: eq 1.1s ease-in-out infinite 0.25s; }
    .e3 { transform-origin: 836px 30px; animation: eq 1.1s ease-in-out infinite 0.5s; }
  </style>

  
  <rect x="4" y="12" width="54" height="24" rx="6" fill="#2e1065" stroke="#c084fc" stroke-opacity="0.7" />
  <circle cx="16" cy="24" r="3" fill="#e879f9" class="dot" />
  <text x="25" y="28" class="num">03</text>

  
  <text x="72" y="30" class="txt">TELEMETRY &amp; ACTIVITY</text>

  
  <rect x="818" y="18" width="4" height="12" rx="2" fill="#a855f7" class="e1" />
  <rect x="826" y="14" width="4" height="16" rx="2" fill="#e879f9" class="e2" />
  <rect x="834" y="20" width="4" height="10" rx="2" fill="#c084fc" class="e3" />

  
  <rect x="4" y="48" width="842" height="2" rx="1" fill="#3b4261" fill-opacity="0.5" />
  <g clip-path="url(#lineClip3)">
    <rect x="0" y="48" width="200" height="2.5" fill="url(#scanPurple)" class="beam" />
  </g>
</svg>
