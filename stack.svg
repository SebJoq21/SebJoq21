<svg width="850" height="384" viewBox="0 0 850 384" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    
    <linearGradient id="bgBackend" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="bgFrontend" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#132a3e" />
    </linearGradient>
    <linearGradient id="bgData" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1423" />
      <stop offset="100%" stop-color="#27183b" />
    </linearGradient>
    <linearGradient id="bgCloud" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#081c15" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#6366f1" stroke-opacity="0.12" stroke-width="1" />
    </pattern>

    
    <radialGradient id="aurora" cx="85%" cy="15%" r="65%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 800; letter-spacing: 1.2px; }
    .pill-txt { font-family: 'Fira Code', Consolas, monospace; font-size: 11.5px; font-weight: 600; fill: #e2e8f0; }
    .sub { font-family: 'Fira Code', Consolas, monospace; font-size: 11px; fill: #94a3b8; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    @keyframes spinSlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes floatY {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }

    .pulse { animation: pulse 2.2s ease-in-out infinite; }
    .spin { transform-origin: 410px 34px; animation: spinSlow 14s linear infinite; }
    .float { animation: floatY 3.5s ease-in-out infinite; }
  </style>

  
  <g>
